<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration page </title>
</head>
<body>
    <h2>Register</h2>
    <form id="registerForm">
        <input id="username" name="username" placeholder="Username" required />
        <br> <br>
        <input id="password" name="password" type="password" placeholder="Password" required />
        <br> <br>
        <button type="submit">Register</button>
        <span>Already have an account? <a href="login.html">Login</a></span>
    </form>

    <form id="allergy_list">
        <h3> select your allergies</h3>
        <input type="checkbox" id="peanut" name="allergy" value="peanut">
        <label for="peanut"> Peanut</label><br>
        <input type="checkbox" id="dairy" name="allergy" value="dairy">
        <label for="dairy"> Dairy</label><br>
        <input type="checkbox" id="gluten" name="allergy" value="gluten">
        <label for="gluten"> Gluten</label><br>
        <input type="checkbox" id="seafood" name="allergy" value="seafood">
        <label for="seafood"> Seafood</label><br>
        <input type="checkbox" id="soy" name="allergy" value="soy">
        <label for="soy"> Soy</label><br>
        <input type="checkbox" id="egg" name="allergy" value="egg">
        <label for="egg"> Egg</label><br>
        <input type="checkbox" id="wheat" name="allergy" value="wheat">
        <label for="wheat"> Wheat</label><br>
        <input type="checkbox" id="legumes" name="allergy" value="legumes">
        <label for="legumes"> Tree Nuts</label><br>
        <input type="text" id="other" placeholder="Other allergies">
    </form>

    <form id="preferences">
        <h3> select your preferences</h3>
        <input type="checkbox" id="vegetarian" name="preference" value="vegetarian">
        <label for="vegetarian"> Vegetarian</label><br>
        <input type="checkbox" id="vegan" name="preference" value="vegan">
        <label for="vegan"> Vegan</label><br>
        <input type="checkbox" id="beef" name="preference" value="beef">
        <label for="beef"> Beef</label><br>
        <input type="checkbox" id="eggs" name="preference" value="eggs">
        <label for="eggs"> Eggs</label><br>
        <input type="checkbox" id="chicken" name="preference" value="chicken">
        <label for="chicken"> Chicken</label><br>
        <input type="checkbox" id="pork" name="preference" value="pork">
        <label for="pork"> Pork</label><br>
        <input type="checkbox" id="fish" name="preference" value="fish">
        <label for="fish"> Fish</label><br>
        <input type="text" id="other_pref" placeholder="Other preferences">
        <br><br>
    </form>

    <p id="msg"></p>

    <script>
        const form = document.getElementById("registerForm");
        const msg = document.getElementById("msg");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            //get username/password by id 
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();

            //collect allergies
            const allergies = Array.from(document.querySelectorAll('input[name="allergy"]:checked'))
                .map(cb => cb.value);

            //include "Other allergies"
            const otherAllergy = document.getElementById("other").value.trim();
            if (otherAllergy) allergies.push(otherAllergy);

            //collect preferences
            const preferences = Array.from(document.querySelectorAll('input[name="preference"]:checked'))
                .map(cb => cb.value);

            //include "Other preferences"
            const otherPref = document.getElementById("other_pref").value.trim();
            if (otherPref) preferences.push(otherPref);

            if (!username || !password) {
                msg.innerText = "Please enter username and password";
                msg.style.color = "red";
                return;
            }

            try {
                const res = await fetch("/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password, allergies, preferences })
                });

                const text = await res.text();

                if (res.ok) {
                    msg.innerText = text;
                    msg.style.color = "green";
                    setTimeout(() => {
                        window.location.href = "/login.html";
                    }, 1000);
                } else {
                    msg.innerText = text;
                    msg.style.color = "red";
                }
            } catch (err) {
                msg.innerText = "Server error";
                msg.style.color = "red";
                console.error(err);
            }
        });
    </script>
</body>
</html>
