<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <style>

        /* ===== SAME STYLE AS CREATE PAGE ===== */

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background-image: url('images/background.avif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #f0f8ff;
            font-family: Georgia, serif;
            color: #333;
        }

        /* HEADER */

        header {
            background-color: #e7b262;
            color: white;
            text-align: center;
            padding: 18px 10px 10px;
        }

        header h1 {
            width: 400px;
            height: 120px;
            margin: 0 auto;
            background-image: url('images/logo.png');
            background-size: 100px 100px;
            background-repeat: no-repeat;
            background-position: left center;
            padding-left: 70px;
            font-size: 52px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,.5);
            line-height: 120px;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 10px 0 8px;
        }

        nav li {
            display: inline-block;
            margin: 0 10px;
        }

        nav button {
            background: transparent;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        nav button:hover {
            text-decoration: underline;
            color: #ffeb3b;
        }

        nav button:disabled {
            opacity: .85;
        }

        header hr {
            border: 0;
            border-top: 1px solid rgba(255,255,255,.35);
            margin: 12px auto 0;
            width: min(900px,92%);
        }

        /* MAIN */

        main {
            text-align: center;
            margin-top: 30px;
            padding: 0 14px 40px;
        }

        /* GLASS BOX */

        .box {
            display: inline-block;
            text-align: left;
            margin-top: 14px;
            width: min(650px,92vw);
            background-color: #ffffff0a;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,.22);
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 10px 25px rgba(0,0,0,.18);
        }

        /* SECTIONS */

        .section {
            margin-top: 18px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,.18);
        }

        .section:first-child {
            border-top: none;
            padding-top: 0;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 9px 10px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.28);
            background: rgba(255,255,255,.12);
            outline: none;
            font-family: Georgia, serif;
            margin-bottom: 10px;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 6px;
            margin-top: 8px;
        }

        .checkbox-grid label {
            font-weight: normal;
            font-size: 14px;
        }

        .actions {
            text-align: center;
            margin-top: 18px;
        }

        .actions button {
            background-color: #e7b262;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }

        .actions button:hover {
            background-color: #ffeb3b;
            color: #333;
        }

        .login-link {
            text-align: center;
            margin-top: 12px;
        }

        .login-link a {
            color: #333;
            font-weight: bold;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        #msg {
            margin-top: 12px;
            font-weight: bold;
            text-align: center;
        }

    </style>
</head>

<body>

<header>
    <h1>RecipeBook</h1>
    <nav>
        <ul>
            <li><button onclick="window.location.href='/'">Home</button></li>
            <li><button disabled>Register</button></li>
            <li><button onclick="window.location.href='login.html'">Login</button></li>
        </ul>
    </nav>
    <hr>
</header>

<main>

    <div class="box">

        <form id="registerForm">

            <div class="section">
                <label>Username</label>
                <input id="username" type="text" required minlength="6" placeholder="min 6 characters">

                <label>Password</label>
                <input id="password" type="password" required minlength="6" placeholder="min 6 characters">
            </div>

            <div class="section">
                <h3>Select Your Allergies</h3>

                <div class="checkbox-grid">
                    <label><input type="checkbox" name="allergy" value="peanut"> Peanut</label>
                    <label><input type="checkbox" name="allergy" value="dairy"> Dairy</label>
                    <label><input type="checkbox" name="allergy" value="gluten"> Gluten</label>
                    <label><input type="checkbox" name="allergy" value="seafood"> Seafood</label>
                    <label><input type="checkbox" name="allergy" value="soy"> Soy</label>
                    <label><input type="checkbox" name="allergy" value="egg"> Egg</label>
                    <label><input type="checkbox" name="allergy" value="wheat"> Wheat</label>
                    <label><input type="checkbox" name="allergy" value="tree_nuts"> Tree Nuts</label>
                </div>

                <input type="text" id="other" placeholder="Other allergies">
            </div>

            <div class="section">
                <h3>Select Your Preferences</h3>

                <div class="checkbox-grid">
                    <label><input type="checkbox" name="preference" value="vegetarian"> Vegetarian</label>
                    <label><input type="checkbox" name="preference" value="vegan"> Vegan</label>
                    <label><input type="checkbox" name="preference" value="beef"> Beef</label>
                    <label><input type="checkbox" name="preference" value="eggs"> Eggs</label>
                    <label><input type="checkbox" name="preference" value="chicken"> Chicken</label>
                    <label><input type="checkbox" name="preference" value="pork"> Pork</label>
                    <label><input type="checkbox" name="preference" value="fish"> Fish</label>
                </div>

                <input type="text" id="other_pref" placeholder="Other preferences">
            </div>

            <div class="actions">
                <button type="submit">Register</button>
            </div>

            <div class="login-link">
                Already have an account? <a href="login.html">Login</a>
            </div>

            <p id="msg"></p>

        </form>

    </div>

</main>

<script>
    const form = document.getElementById("registerForm");
    const msg = document.getElementById("msg");

    function getCheckedValues(name) {
        return Array.from(document.querySelectorAll(`input[name="${name}"]:checked`))
            .map(cb => cb.value);
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        msg.textContent = "";
        msg.style.color = "#333";

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();

        const allergies = getCheckedValues("allergy");
        const other = document.getElementById("other").value.trim();
        if (other) allergies.push(other);

        const preferences = getCheckedValues("preference");
        const otherPref = document.getElementById("other_pref").value.trim();
        if (otherPref) preferences.push(otherPref);

        try {
            const res = await fetch("/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password, allergies, preferences })
            });

            const text = await res.text();

            if (!res.ok) {
                msg.style.color = "crimson";
                msg.textContent = text || "Registration failed";
                return;
            }

            msg.style.color = "green";
            msg.textContent = text || "User registered successfully";

            setTimeout(() => {
                window.location.href = "login.html";
            }, 700);

        } catch (err) {
            console.error(err);
            msg.style.color = "crimson";
            msg.textContent = "Network/server error";
        }
    });
</script>

</body>
</html>
