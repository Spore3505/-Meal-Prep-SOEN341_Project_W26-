<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Random Recipe</title>

  <style>
    body {
      font-family: Georgia, serif;
      background: #f0f8ff;
      text-align: center;
      padding: 40px;
    }

    .btn {
      margin: 10px;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #e7b262;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      background: #ffeb3b;
      color: #333;
    }

    .card {
      max-width: 500px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    .tag {
      display: inline-block;
      background: #ffd27f;
      padding: 5px 10px;
      border-radius: 20px;
      margin: 3px;
      font-size: 13px;
    }

    #msg {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>🎲 Random Recipe Generator</h1>

<div id="recipeCard" class="card">Click button to load recipe</div>

<button class="btn" onclick="handleRandomSave()">Get Random Recipe</button>

<p id="msg"></p>

<script>
  let allRecipes = [];
  let myRecipes = [];
  let currentRecipe = null;

  // escape HTML
  function esc(s) {
    return String(s ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;");
  }

  // LOAD ALL RECIPES
  async function loadAllRecipes() {
    const res = await fetch("/recipes/all");
    const data = await res.json();

    myRecipes = data.mine || [];
    allRecipes = [...(data.mine || []), ...(data.global || [])];
  }

  // DISPLAY RECIPE
  function displayRecipe(recipe) {
    const card = document.getElementById("recipeCard");

    const tags = recipe.dietaryTags || [];

    card.innerHTML = `
    <h2>${esc(recipe.title)}</h2>
    <p>${esc(recipe.description || "")}</p>

    <div>
      ${tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}
    </div>

    <h4>Ingredients</h4>
    <ul>
      ${(recipe.ingredients || []).map(i => `<li>${esc(i)}</li>`).join("")}
    </ul>

    <h4>Steps</h4>
    <ul>
      ${(recipe.steps || []).map(s => `<li>${esc(s)}</li>`).join("")}
    </ul>
  `;
  }

  // MAIN FUNCTION
  async function handleRandomSave() {
    const msg = document.getElementById("msg");

    try {
      // reload recipes (fresh data)
      await loadAllRecipes();

      if (!allRecipes.length) {
        msg.innerText = "No recipes available.";
        return;
      }

      // pick random
      currentRecipe = allRecipes[Math.floor(Math.random() * allRecipes.length)];

      displayRecipe(currentRecipe);

      // check duplicate
      const isDuplicate = myRecipes.some(r =>
              r.title.trim().toLowerCase() === currentRecipe.title.trim().toLowerCase()
      );

      if (isDuplicate) {
        msg.style.color = "red";
        msg.innerText = "⚠️ Duplicate recipe! Try again.";
        return; // STOP
      }

      // save recipe
      const res = await fetch("/recipes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(currentRecipe)
      });

      if (!res.ok) throw new Error();

      msg.style.color = "green";
      msg.innerText = "✅ Recipe saved! Redirecting...";

      // redirect after short delay
      setTimeout(() => {
        window.location.href = "recipes.html";
      }, 1000);

    } catch (err) {
      console.error(err);
      msg.style.color = "red";
      msg.innerText = "Error processing recipe.";
    }
  }

  // initial load
  loadAllRecipes();
</script>

</body>
</html>
