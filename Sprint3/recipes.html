<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Recipes</title>

  <style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; }

    body {
      background-image: url('images/background.avif');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #f0f8ff;
      font-family: Georgia, serif;
      color: #333;
    }

    header {
      background-color: #e7b262;
      color: white;
      text-align: center;
      padding: 18px 10px 10px;
    }

    header h1 {
      width: 400px;
      height: 120px;
      margin: 0 auto;
      background-image: url('images/logo.png');
      background-size: 100px 100px;
      background-repeat: no-repeat;
      background-position: left center;
      padding-left: 70px;
      font-size: 52px;
      font-weight: bold;
      letter-spacing: 2px;
      text-shadow: 2px 2px 4px rgba(0,0,0,.5);
      line-height: 120px;
    }

    nav ul { list-style: none; padding: 0; margin: 10px 0 8px; }
    nav li { display: inline-block; margin: 0 10px; }
    nav button {
      background: transparent;
      border: none;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }
    nav button:hover { text-decoration: underline; color: #ffeb3b; }
    nav button:disabled { opacity: .9; cursor: default; }

    header hr {
      border: 0;
      border-top: 1px solid rgba(255,255,255,.35);
      margin: 12px auto 0;
      width: min(900px,92%);
    }

    main {
      text-align: center;
      margin-top: 30px;
      padding: 0 14px 60px;
    }

    .wrap {
      width: min(1050px, 94vw);
      margin: 0 auto;
      text-align: left;
    }

    h2 { text-align: center; margin: 0 0 18px; }

    /* Top actions */
    .topActions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .searchInput {
      padding: 8px 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      font-family: Georgia, serif;
      width: 260px;
    }

    .btn {
      background-color: #e7b262;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 9px 12px;
      cursor: pointer;
      font-weight: bold;
      user-select: none;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }
    .btn:hover { background-color: #ffeb3b; color: #333; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .sectionTitle {
      margin: 26px 0 10px;
      font-size: 20px;
      font-weight: bold;
    }

    /* ===== Horizontal scroll row ===== */
    .rowWrap {
      position: relative;
    }

    .scrollRow {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(280px, 320px);
      gap: 14px;

      overflow-x: auto;
      overflow-y: hidden;
      padding: 6px 6px 14px;

      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;

      /* nicer scrolling */
      -webkit-overflow-scrolling: touch;
    }

    /* Hide scrollbar (still scrollable) */
    .scrollRow::-webkit-scrollbar { height: 10px; }
    .scrollRow::-webkit-scrollbar-track { background: rgba(255,255,255,.10); border-radius: 999px; }
    .scrollRow::-webkit-scrollbar-thumb { background: rgba(255,255,255,.35); border-radius: 999px; }

    .card {
      scroll-snap-align: start;

      background-color: #ffffff0a;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,.18);

      /* animations */
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUp 380ms ease forwards;

      transition: transform 180ms ease, box-shadow 180ms ease;
      will-change: transform;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 34px rgba(0,0,0,.22);
    }

    /* stagger effect using CSS var */
    .card { animation-delay: calc(var(--i, 0) * 40ms); }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .card h3 { margin: 0 0 6px; }
    .meta { font-size: 14px; opacity: .95; margin-bottom: 10px; }
    .desc { margin: 8px 0 10px; }
    .listTitle { font-weight: bold; margin: 10px 0 6px; }
    ul { margin: 0 0 8px 18px; padding: 0; }

    .empty {
      text-align: center;
      padding: 18px;
      border: 1px dashed rgba(255,255,255,.35);
      border-radius: 14px;
      background: rgba(255,255,255,.08);
    }

    /* Optional arrow buttons */
    .arrowBtn {
      position: absolute;
      top: 50%;
      transform: translateY(-55%);
      z-index: 5;

      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.28);
      background: rgba(231,178,98,.85);
      color: #fff;
      font-weight: bold;
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      box-shadow: 0 10px 20px rgba(0,0,0,.18);
      transition: transform 160ms ease, background 160ms ease;
      user-select: none;
    }
    .arrowBtn:hover { background: rgba(255,235,59,.9); color:#333; transform: translateY(-55%) scale(1.06); }
    .arrowLeft { left: -10px; }
    .arrowRight { right: -10px; }

    /* On small screens, hide arrows (swipe is better) */
    @media (max-width: 520px) {
      .arrowBtn { display: none; }
      .scrollRow { grid-auto-columns: minmax(260px, 85vw); }
    }

.filterSidebar {
  position: fixed;
  top: 0;
  right: -320px;
  width: 300px;
  height: 100%;
  background: #fff;
  box-shadow: -4px 0 18px rgba(0,0,0,.3);
  padding: 16px;
  transition: right 0.3s ease;
  z-index: 100;
}

.filterSidebar.show {
  right: 0; 
}

.filterHeader {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.filterHeader h3 {
  margin: 0;
}

.filterSidebar input {
  width: 100%;
  margin-bottom: 8px;
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-family: Georgia, serif;
}

.filterTag {
      background: rgba(241, 173, 70, 0.719);
      color: #333;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: default;
      box-shadow: 0 4px 8px rgba(0,0,0,0.12);
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

  .filterTag:hover {
      background: rgba(231, 178, 98, 0.45);
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.18);
    }

    .filterTag span.remove {
      font-weight: bold;
      cursor: pointer;
      color: #c94b4b;
      padding-left: 4px;
      font-size: 16px;
      line-height: 1;
    }
  </style>
</head>

<body>
  <header>
    <h1>MealMajor</h1>

    <nav>
      <ul>
        <li><button onclick="window.location.href='/'">Home</button></li>
        <li><button onclick="window.location.href='account.html'">Account</button></li>
        <li><button onclick="window.location.href='create.html'">Create</button></li>
        <li><button disabled>My Recipes</button></li>
        <li><button onclick="window.location.href='view_mealplan.html'">My Meal Plan</button></li>
      </ul>
    </nav>
    <hr />
  </header>

  <main>
    <div class="wrap">
      <h2>Recipes</h2>
      
      <div class="topActions">
        <input id="searchInput" class="searchInput" type="text" placeholder="Search recipe by title..." />
        <button class="btn" onclick="loadAll()">Refresh</button>
        <button class="btn" onclick="window.location.href='create.html'">Add New Recipe</button>
        <button class="btn" id="filterToggleBtn">Filters ⚙️</button> <!-- 新增按钮 -->
</div>

<div class="sectionTitle">My Personal Recipes</div>
<div class="rowWrap">
        <button class="arrowBtn arrowLeft" type="button" onclick="scrollRow('mine', -1)">‹</button>
        <button class="arrowBtn arrowRight" type="button" onclick="scrollRow('mine', 1)">›</button>
        <div id="mine" class="scrollRow"></div>
</div>

  <div class="sectionTitle">Global Recipes</div>
  <div class="rowWrap">
        <button class="arrowBtn arrowLeft" type="button" onclick="scrollRow('global', -1)">‹</button>
        <button class="arrowBtn arrowRight" type="button" onclick="scrollRow('global', 1)">›</button>
        <div id="global" class="scrollRow"></div>
      </div>
    </div>
  </main>
  <!-- Filter Sidebar -->
  <div id="filterSidebar" class="filterSidebar">
    <div class="filterHeader">
      <h3>Filters</h3>
      <button class="btn" id="closeFilterBtn">×</button>
    </div>
    <div id="filterFormSidebar">
      <input type="number" id="minPrepTime" placeholder="Min Prep Time" />
      <input type="number" id="maxPrepTime" placeholder="Max Prep Time" />
      <input type="number" id="minCookTime" placeholder="Min Cook Time" />
      <input type="number" id="maxCookTime" placeholder="Max Cook Time" />
      <input type="number" id="minCost" placeholder="Min Cost" />
      <input type="number" id="maxCost" placeholder="Max Cost" />
      <button class="btn" id="applyFilterBtn">Apply Filters</button>
      <div id="activeFilters" style="display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;"></div>
    </div>
  </div>

  <script>
    let allMine = [];
    let allGlobal = [];

    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function fmtNumber(n) {
      const num = Number(n);
      return Number.isFinite(num) ? num : 0;
    }

    function renderRecipeCard(r, index) {
      const prep = fmtNumber(r.prepTime);
      const cook = fmtNumber(r.cookTime);
      const cost = fmtNumber(r.cost);

      const ingredients = Array.isArray(r.ingredients) ? r.ingredients : [];
      const steps = Array.isArray(r.steps) ? r.steps : [];

      return `
        <div class="card" style="--i:${index}">
          <h3>${esc(r.title || "Untitled")}</h3>
          <div class="meta">
            Prep: ${prep} min · Cook: ${cook} min · Cost: $${cost.toFixed(2)}
          </div>
          ${r.description ? `<div class="desc">${esc(r.description)}</div>` : ""}

          <div class="listTitle">Ingredients</div>
          ${
            ingredients.length
              ? `<ul>${ingredients.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`
              : `<div class="meta">No ingredients listed.</div>`
          }

  <div class="listTitle">Steps</div>
          ${
            steps.length
              ? `<ul>${steps.map(s => `<li>${esc(s)}</li>`).join("")}</ul>`
              : `<div class="meta">No steps listed.</div>`
          }
          <div style="margin-top:12px; display:flex; gap:8px;">
          <button class="btn" data-id="${r.id}" onclick="editRecipe(this.dataset.id)">Edit</button>
        <button class="btn" data-id="${r.id}" onclick="deleteRecipe(this.dataset.id)" style="background:#c94b4b;">Delete</button>
      </div>
        </div>
      `;
    }



    function renderSection(containerId, recipes) {
      const el = document.getElementById(containerId);

      if (!recipes || !recipes.length) {
        el.innerHTML = `<div class="empty">No recipes found.</div>`;
        return;
      }

      el.innerHTML = recipes.map((r, i) => renderRecipeCard(r, i)).join("");
    }

    function applySearch() {
      const query = document.getElementById("searchInput").value.toLowerCase();

      const filteredMine = allMine.filter(r =>
        String(r.title || "").toLowerCase().includes(query)
      );

      const filteredGlobal = allGlobal.filter(r =>
        String(r.title || "").toLowerCase().includes(query)
      );

      renderSection("mine", filteredMine);
      renderSection("global", filteredGlobal);
    }

    async function loadAll() {
      try {
        const res = await fetch("/recipes/all");
        if (!res.ok) throw new Error("Failed to load recipes");
        const data = await res.json();

        allMine = data.mine || [];
        allGlobal = data.global || [];

        // show full list first, then search applies if user typed
        applySearch();
      } catch (e) {
        console.error(e);
        alert("Could not load recipes (server error).");
      }
    }

    function scrollRow(id, dir) {
      const el = document.getElementById(id);
      if (!el) return;

      // scroll roughly one card width
      const card = el.querySelector(".card");
      const step = card ? (card.getBoundingClientRect().width + 14) : 320;
      el.scrollBy({ left: dir * step, behavior: "smooth" });
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("searchInput").addEventListener("input", applySearch);
      loadAll();
    });


    function editRecipe(id) {
  // Redirect to edit page with recipe ID
  window.location.href = `edit.html?id=${id}`;
}

async function deleteRecipe(id) {
  console.log("Deleting recipe id:", id);
  if (!confirm("Are you sure you want to delete this recipe?")) return;

  try {
    const res = await fetch(`/recipes/${id}`, {
      method: "DELETE",
      credentials: "include"
    });
    if (!res.ok) throw new Error("Delete failed");
    loadAll();
  } catch (err) {
    console.error(err);
    alert("Failed to delete recipe.");
  }
}

const activeFiltersEl = document.getElementById("activeFilters");
const filters = {};
    function applyFilter(){
      const fkeys=["PrepTime","CookTime","Cost"];
      const vals=["minPrepTime","maxPrepTime","minCookTime","maxCookTime","minCost","maxCost"];
      if(document.getElementById("minPrepTime").value||document.getElementById("maxPrepTime").value) filters.prepTime={min:document.getElementById("minPrepTime").value,max:document.getElementById("maxPrepTime").value}; else delete filters.prepTime;
      if(document.getElementById("minCookTime").value||document.getElementById("maxCookTime").value) filters.cookTime={min:document.getElementById("minCookTime").value,max:document.getElementById("maxCookTime").value}; else delete filters.cookTime;
      if(document.getElementById("minCost").value||document.getElementById("maxCost").value) filters.cost={min:document.getElementById("minCost").value,max:document.getElementById("maxCost").value}; else delete filters.cost;
      renderFilterTags(); applySearch();
    }


function renderFilterTags() {
    activeFiltersEl.innerHTML = "";
    for(const key in filters) {
      const f = filters[key];
      const text = `${key}: ${f.min||0} - ${f.max||'∞'}`;
      const tag = document.createElement("div");
      tag.className = "filterTag";
      tag.innerHTML = `${text} <span class="remove" onclick="removeFilter('${key}')">×</span>`;
      activeFiltersEl.appendChild(tag);
    }
  }

  function removeFilter(key) {
    delete filters[key];
    renderFilterTags();
    applySearch();
  }
  function applySearch() {
    const query = document.getElementById("searchInput").value.toLowerCase();

    function matchFilter(r) {
      for(const key in filters) {
        const f = filters[key];
        const val = r[key];
        if(f.min && val < Number(f.min)) return false;
        if(f.max && val > Number(f.max)) return false;
      }
      return String(r.title||"").toLowerCase().includes(query);
    }

    const filteredMine = allMine.filter(matchFilter);
    const filteredGlobal = allGlobal.filter(matchFilter);

    renderSection("mine", filteredMine);
    renderSection("global", filteredGlobal);
  }

const filterSidebar = document.getElementById("filterSidebar");
const filterToggleBtn = document.getElementById("filterToggleBtn");
const closeFilterBtn = document.getElementById("closeFilterBtn");

filterToggleBtn.addEventListener("click", () => {
  filterSidebar.classList.toggle("show");
});

closeFilterBtn.addEventListener("click", () => {
  filterSidebar.classList.remove("show");
});


document.getElementById("applyFilterBtn").addEventListener("click", () => {
  applyFilter();
  filterSidebar.classList.remove("show");
});

  </script>
</div>
</body>
</html>
