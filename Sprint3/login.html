<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login</title>
  <link rel="stylesheet" href="style_login_register_home.css">
  <style>
    header { text-align: center; }
    nav ul { list-style: none; padding: 0; }
    nav li { display: inline; margin: 0 10px; }
    section { text-align: center; margin-top: 40px; padding: 0 14px 40px; }

    .box {
      display: inline-block;
      text-align: left;
      margin-top: 14px;
      width: min(400px, 92vw);
      background-color: #ffffff0a;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 14px;
      padding: 28px 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,.18);
    }

    .box h2 {
      margin: 0 0 20px;
      text-align: center;
      font-family: Georgia, serif;
      font-size: 24px;
      letter-spacing: 1px;
      color: #fff;
      text-shadow: 1px 1px 3px rgba(0,0,0,.4);
    }

    .box input[type="text"],
    .box input[type="password"] {
      width: 100%;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.28);
      background: rgba(255,255,255,.12);
      outline: none;
      font-family: Georgia, serif;
      margin-bottom: 12px;
      box-sizing: border-box;
    }

    .box button[type="submit"] {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      background-color: #e7b262;
      color: #fff;
      font-family: Georgia, serif;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 4px;
    }

    .box button[type="submit"]:hover {
      background-color: #ffeb3b;
      color: #333;
    }

    .register-link {
      text-align: center;
      margin-top: 14px;
      font-family: Georgia, serif;
      font-size: 14px;
    }
  </style>
</head>
<body>

<header>
  <h1>MealMajor</h1>

  <nav>
    <ul>
      <li><a href="/">HOME</a></li>
      <li><a id="authLink" href="login.html">LOGIN</a></li>
    </ul>
  </nav>

  <hr>
</header>

<section>
  <div class="box">
    <h2>LOGIN</h2>

    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required><br>
      <input type="password" id="password" placeholder="Password" required><br>
      <button type="submit">LOGIN</button>
    </form>

    <div class="register-link">
      If you don't have an account, please <a href="register.html">Register</a>
    </div>
  </div>
</section>

<script>
  // =========================
  // Check if already logged in
  // =========================
  (async function () {
    try {
      const res = await fetch("/me");
      const data = await res.json();

      const authLink = document.getElementById("authLink");

      if (data.loggedIn) {
        // Change nav to ACCOUNT
        if (authLink) {
          authLink.textContent = "ACCOUNT";
          authLink.href = "account.html"; // or recipes.html
        }

        // Redirect automatically
        window.location.href = "recipes.html"; // or account.html
      } else {
        if (authLink) {
          authLink.textContent = "LOGIN";
          authLink.href = "login.html";
        }
      }
    } catch (e) {
      console.error("Session check failed:", e);
    }
  })();

  // =========================
  // Login form submit
  // =========================
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    try {
      const response = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      if (response.ok) {
        window.location.href = "recipes.html";
      } else {
        alert("Wrong username or password");
      }
    } catch (err) {
      console.error(err);
      alert("Server error");
    }
  });
</script>

</body>

</html>
