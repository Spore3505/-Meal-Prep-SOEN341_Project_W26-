name: Lint CI

on:
  push:
    branches: ["master"]
    paths:
      - "public/**/*.js"
      - "src/**/*.js"
      - "public/**/*.css"
      - ".github/workflows/**"
      - "eslint.config.*"
      - "stylelint.config.*"
      - "package.json"
      - "package-lock.json"

  pull_request:
    branches: ["master"]
    paths:
      - "public/**/*.js"
      - "src/**/*.js"
      - "public/**/*.css"
      - ".github/workflows/**"
      - "eslint.config.*"
      - "stylelint.config.*"
      - "package.json"
      - "package-lock.json"

  workflow_dispatch: {}

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint
