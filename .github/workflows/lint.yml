# .github/workflows/lint.yml
name: Lint CI

on:
  push:
    branches: ["main"]
    paths:
      - "public/**/*.js"
      - "src/**/*.js"
      - "eslint.config.*"
      - "stylelint.config.*"
      - "package.json"
      - "package-lock.json"

  pull_request:
    branches: ["main"]
    paths:
      - "public/**/*.js"
      - "src/**/*.js"
      - "eslint.config.*"
      - "stylelint.config.*"
      - "package.json"
      - "package-lock.json"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint