name: Sprint4 CI

on:
  push:
    branches: ["main"]
    paths:
      - "public/**"
      - "src/**"
      - ".github/workflows/**"
      - "package-lock.json"
      - "package.json"
  pull_request:
    branches: ["main"]
    paths:
      - "public/**"
      - "src/**"
      - ".github/workflows/**"
      - "package-lock.json"
      - "package.json"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/controllers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/controllers/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
