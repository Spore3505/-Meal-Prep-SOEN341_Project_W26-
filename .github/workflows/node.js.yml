name: Sprint2 CI

on:
  push:
    branches: ["main"]
    paths:
      - "Sprint2/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["main"]
    paths:
      - "Sprint2/**"
      - ".github/workflows/**"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Sprint2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
