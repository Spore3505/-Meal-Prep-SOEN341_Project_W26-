<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meal Planner</title>
  <link rel="stylesheet" href="/CSS/view_mealplan.css">
</head>
<body>

<header>
  <h1>MealMajor</h1>
  <nav>
    <ul>
      <li><button onclick="window.location.href='/'">Home</button></li>
      <li><button onclick="window.location.href='account.html'">Account</button></li>
      <li><button onclick="window.location.href='create.html'">Create</button></li>
      <li><button onclick="window.location.href='recipes.html'">My Recipes</button></li>
      <li><button disabled>My Meal Plan</button></li>
    </ul>
  </nav>
  <hr>
</header>

<!-- =========================
     WEEKLY MEAL PLANNER
========================= -->
<section>
  <h2>WEEKLY MEAL PLAN</h2>

  <div class="topActions">
    <button
      class="pick-recipe-btn"
      onclick="window.location.href='random_pick.html'">
      🎲 Pick a Recipe For Me
    </button>
  </div>

  <div id="planner"></div>
</section>


<div id="recipeModal" class="modal">
  <div class="modal-content">
    <h3>Select Recipe</h3>
    <input type="text" id="searchInput" placeholder="Search recipes...">
    <div id="recipeList"></div>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

<script src="/js/view_mealplan.js"></script>


</body>
</html>
