<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login</title>
    <link rel="stylesheet" href="/CSS/style_login_register_home.css">
    <style>
    header { text-align: center; }
    nav ul { list-style: none; padding: 0; }
    nav li { display: inline; margin: 0 10px; }
    section { text-align: center; margin-top: 40px; }
  </style>
</head>
<body>

<header>
  <h1>MealMajor</h1>

  <nav>
    <ul>
      <li><a href="/">HOME</a></li>
      <li><a id="authLink" href="login.html">LOGIN</a></li>
    </ul>
  </nav>

  <hr>
</header>

<section>
  <h2>LOGIN</h2>

  <h3>Please enter your username and password</h3>

  <form id="loginForm">
    <input type="text" id="username" placeholder="Username" required><br><br>
    <input type="password" id="password" placeholder="Password" required><br><br>
    <button type="submit">LOGIN</button>
  </form>

  <br>
  <span>If you don’t have an account, please <a href="register.html">Register</a></span>
</section>

<script src="/js/login.js"></script>
</body>
</html>
