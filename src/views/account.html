<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Page</title>
  <link rel="stylesheet" href="/CSS/account.css">
</head>
<body>

<header>
  <h1>MealMajor</h1>

  <nav>
    <ul>
      <li><button onclick="window.location.href='/'">Home</button></li>
      <li><button onclick="window.location.href='create.html'">Create</button></li>
      <li><button onclick="window.location.href='recipes.html'">My Recipes</button></li>
      <li><button onclick="window.location.href='view_mealplan.html'">My Meal Plan</button></li>
      <li><button disabled>Account</button></li>
    </ul>
  </nav>

  <hr>
</header>

<main>
  <p>Welcome to your account.</p>

  <div class="box">
    <!-- ALLERGIES -->
    <div class="section">
      <h3>Edit your allergies</h3>

      <div class="row"><label><input type="checkbox" name="allergy" value="peanut"> Peanut</label></div>
      <div class="row"><label><input type="checkbox" name="allergy" value="dairy"> Dairy</label></div>
      <div class="row"><label><input type="checkbox" name="allergy" value="gluten"> Gluten</label></div>
      <div class="row"><label><input type="checkbox" name="allergy" value="seafood"> Seafood</label></div>
      <div class="row"><label><input type="checkbox" name="allergy" value="soy"> Soy</label></div>
      <div class="row"><label><input type="checkbox" name="allergy" value="egg"> Egg</label></div>
      <div class="row"><label><input type="checkbox" name="allergy" value="wheat"> Wheat</label></div>
      <div class="row"><label><input type="checkbox" name="allergy" value="tree nuts"> Tree Nuts</label></div>

      <div class="addLine">
        <input id="otherAllergyInput" type="text" placeholder="Add other allergy (e.g., sesame)">
        <button id="addAllergyTagBtn" type="button">Add</button>
      </div>

      <div id="allergyTags" class="tagWrap"></div>
    </div>

    <!-- PREFERENCES -->
    <div class="section">
      <h3>Edit your preferences</h3>

      <div class="row"><label><input type="checkbox" name="preference" value="vegetarian"> Vegetarian</label></div>
      <div class="row"><label><input type="checkbox" name="preference" value="vegan"> Vegan</label></div>
      <div class="row"><label><input type="checkbox" name="preference" value="beef"> Beef</label></div>
      <div class="row"><label><input type="checkbox" name="preference" value="eggs"> Eggs</label></div>
      <div class="row"><label><input type="checkbox" name="preference" value="chicken"> Chicken</label></div>
      <div class="row"><label><input type="checkbox" name="preference" value="pork"> Pork</label></div>
      <div class="row"><label><input type="checkbox" name="preference" value="fish"> Fish</label></div>

      <div class="addLine">
        <input id="otherPrefInput" type="text" placeholder="Add other preference (e.g., halal)">
        <button id="addPrefTagBtn" type="button">Add</button>
      </div>

      <div id="prefTags" class="tagWrap"></div>
    </div>

    <div class="actions">
      <button id="saveBtn" type="button">SAVE</button>
      <p id="msg"></p>
    </div>
  </div>
</main>

<footer class="logout-footer">
  <button id="logoutBtn">LOGOUT</button>
</footer>
<script src="/js/account.js"></script>
</body>
</html>
