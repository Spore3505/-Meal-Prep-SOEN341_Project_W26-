<!DOCTYPE html>
<html lang="en">
<head>
  <title>Account Page</title>
  <style>
    header { text-align: center; }
    nav ul { list-style: none; padding: 0; }
    nav li { display: inline; margin: 0 10px; }
    main { text-align: center; margin-top: 30px; }

    .box { display: inline-block; text-align: left; margin-top: 20px; width: 420px; }
    .section { margin-top: 18px; }
    .row { margin: 6px 0; }

    .tagWrap { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 999px;
      font-size: 14px;
      user-select: none;
    }
    .tag button {
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0 2px;
    }

    .addLine { display: flex; gap: 8px; margin-top: 10px; }
    .addLine input { flex: 1; padding: 7px; }
    .addLine button { padding: 7px 10px; cursor: pointer; }

    #msg { margin-top: 12px; font-weight: bold; text-align: center; }
    .actions { text-align: center; margin-top: 18px; }
  </style>
</head>
<body>

<header>
  <h1>MealMajor</h1>

  <nav>
    <ul>
      <li><button type="button" disabled>Create</button></li>
      <li><button type="button" disabled>Edit</button></li>
    </ul>
  </nav>

  <hr>
</header>

<main>
  <p>Welcome to your account.</p>

  <div class="box">
    <!-- ALLERGIES -->
    <div class="section">
      <h3>Edit your allergies</h3>

      <div class="row"><label><input type="checkbox" name="allergy" value="peanut"> Peanut</label></div>
      <div class="row"><label><input type="checkbox" name="allergy" value="dairy"> Dairy</label></div>
      <div class="row"><label><input type="checkbox" name="allergy" value="gluten"> Gluten</label></div>
      <div class="row"><label><input type="checkbox" name="allergy" value="seafood"> Seafood</label></div>
      <div class="row"><label><input type="checkbox" name="allergy" value="soy"> Soy</label></div>
      <div class="row"><label><input type="checkbox" name="allergy" value="egg"> Egg</label></div>
      <div class="row"><label><input type="checkbox" name="allergy" value="wheat"> Wheat</label></div>
      <div class="row"><label><input type="checkbox" name="allergy" value="tree nuts"> Tree Nuts</label></div>

      <div class="addLine">
        <input id="otherAllergyInput" type="text" placeholder="Add other allergy (e.g., sesame)">
        <button id="addAllergyTagBtn" type="button">Add</button>
      </div>

      <div id="allergyTags" class="tagWrap"></div>
    </div>

    <!-- PREFERENCES -->
    <div class="section">
      <h3>Edit your preferences</h3>

      <div class="row"><label><input type="checkbox" name="preference" value="vegetarian"> Vegetarian</label></div>
      <div class="row"><label><input type="checkbox" name="preference" value="vegan"> Vegan</label></div>
      <div class="row"><label><input type="checkbox" name="preference" value="beef"> Beef</label></div>
      <div class="row"><label><input type="checkbox" name="preference" value="eggs"> Eggs</label></div>
      <div class="row"><label><input type="checkbox" name="preference" value="chicken"> Chicken</label></div>
      <div class="row"><label><input type="checkbox" name="preference" value="pork"> Pork</label></div>
      <div class="row"><label><input type="checkbox" name="preference" value="fish"> Fish</label></div>

      <div class="addLine">
        <input id="otherPrefInput" type="text" placeholder="Add other preference (e.g., halal)">
        <button id="addPrefTagBtn" type="button">Add</button>
      </div>

      <div id="prefTags" class="tagWrap"></div>
    </div>

    <div class="actions">
      <button id="saveBtn" type="button">SAVE</button>
      <p id="msg"></p>
    </div>
  </div>
</main>

<footer style="text-align:center; margin-top:40px;">
  <button id="logoutBtn">LOGOUT</button>
</footer>

<script>
  const msg = document.getElementById("msg");

  // Tag state (only for "other" items)
  const otherAllergySet = new Set();
  const otherPrefSet = new Set();

  function normalize(str) {
    return String(str || "").trim().toLowerCase();
  }

  function showMsg(text, ok) {
    msg.innerText = text;
    msg.style.color = ok ? "green" : "red";
  }

  function setChecked(groupName, values) {
    const set = new Set(values.map(v => normalize(v)));
    document.querySelectorAll(`input[name="${groupName}"]`).forEach(cb => {
      cb.checked = set.has(normalize(cb.value));
    });
  }

  function collectChecked(groupName) {
    return Array.from(document.querySelectorAll(`input[name="${groupName}"]:checked`))
      .map(cb => cb.value);
  }

  function knownValues(groupName) {
    return new Set(
      Array.from(document.querySelectorAll(`input[name="${groupName}"]`))
        .map(cb => normalize(cb.value))
    );
  }

  function renderTags(containerId, setRef) {
    const container = document.getElementById(containerId);
    container.innerHTML = "";

    Array.from(setRef).sort().forEach(label => {
      const pill = document.createElement("span");
      pill.className = "tag";
      pill.textContent = label;

      const x = document.createElement("button");
      x.type = "button";
      x.innerHTML = "✕";
      x.title = "Remove";
      x.addEventListener("click", () => {
        setRef.delete(label);
        renderTags(containerId, setRef);
      });

      pill.appendChild(x);
      container.appendChild(pill);
    });
  }

  function addTag(setRef, containerId, raw) {
    const clean = normalize(raw);
    if (!clean) return;

    // avoid duplicates (case-insensitive)
    if (!setRef.has(clean)) setRef.add(clean);

    renderTags(containerId, setRef);
  }

  // Add tag button + Enter-to-add
  document.getElementById("addAllergyTagBtn").addEventListener("click", () => {
    const input = document.getElementById("otherAllergyInput");
    addTag(otherAllergySet, "allergyTags", input.value);
    input.value = "";
    input.focus();
  });

  document.getElementById("otherAllergyInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      document.getElementById("addAllergyTagBtn").click();
    }
  });

  document.getElementById("addPrefTagBtn").addEventListener("click", () => {
    const input = document.getElementById("otherPrefInput");
    addTag(otherPrefSet, "prefTags", input.value);
    input.value = "";
    input.focus();
  });

  document.getElementById("otherPrefInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      document.getElementById("addPrefTagBtn").click();
    }
  });

  // Load existing profile
  (async function loadProfile() {
    try {
      const res = await fetch("/profile");
      if (!res.ok) throw new Error("Failed to load profile");
      const data = await res.json();

      const allergies = data.allergies || [];
      const preferences = data.preferences || [];

      // mark known checkbox values
      setChecked("allergy", allergies);
      setChecked("preference", preferences);

      // put unknown values into tags
      const knownAll = knownValues("allergy");
      const knownPref = knownValues("preference");

      otherAllergySet.clear();
      otherPrefSet.clear();

      allergies.forEach(a => {
        const n = normalize(a);
        if (n && !knownAll.has(n)) otherAllergySet.add(n);
      });

      preferences.forEach(p => {
        const n = normalize(p);
        if (n && !knownPref.has(n)) otherPrefSet.add(n);
      });

      renderTags("allergyTags", otherAllergySet);
      renderTags("prefTags", otherPrefSet);
    } catch (e) {
      console.error(e);
      showMsg("Could not load your profile", false);
    }
  })();

  // Save updates
  document.getElementById("saveBtn").addEventListener("click", async () => {
    msg.innerText = "";

    // combine checked + tag values
    const allergies = [
      ...collectChecked("allergy"),
      ...Array.from(otherAllergySet)
    ];

    const preferences = [
      ...collectChecked("preference"),
      ...Array.from(otherPrefSet)
    ];

    try {
      const res = await fetch("/profile", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ allergies, preferences })
      });

      const text = await res.text();
      if (res.ok) showMsg(text || "Profile updated", true);
      else showMsg(text || "Save failed", false);
    } catch (e) {
      console.error(e);
      showMsg("Server error", false);
    }
  });

  // Logout
  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await fetch("/logout", { method: "POST" });
    window.location.href = "Home.html";
  });
</script>

</body>
</html>
